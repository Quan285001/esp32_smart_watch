[env:c3_clock]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200

extra_scripts = 
	pre:scripts/patch_tft_c3.py

lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	bblanchon/ArduinoJson@^7.2.2
	bodmer/TFT_eSPI@^2.5.43

build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	
	-D USER_SETUP_LOADED=1
	-D GC9A01_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MISO=-1
	
	-D TFT_SCLK=4
	-D TFT_MOSI=6
	-D TFT_CS=7
	-D TFT_DC=2
	-D TFT_RST=3
	-D BOOT_BTN=9
	-D AUTO_SLEEP_TIMEOUT_MS=15000
	
	-D SPI_FREQUENCY=40000000

	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1