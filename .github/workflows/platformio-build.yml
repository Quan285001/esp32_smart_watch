name: PlatformIO firmware build

on:
  push:
    branches:
      - main
      - feature/hybrid-weather
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP32-C3 firmware
        run: pio run -e c3_clock
